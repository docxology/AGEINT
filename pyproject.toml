# AGEINT Project Configuration
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ageint_curriculum"
version = "0.1.0"
description = "Shard-first Agentic Intelligence modular curriculum and manuscript build"
authors = [{name = "DAF"}]
requires-python = ">=3.10"
dependencies = ["pillow>=10.0", "pyyaml>=6.0", "pypdf>=5.0"]

[project.optional-dependencies]
# ruff belongs here (not `uvx ruff`) so uv.lock pins the linter version. See the
# [tool.ruff.lint] note below for why an unpinned linter is a CI hazard.
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "reportlab>=4.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}
# Complete list of flat top-level modules under src/ (subpackages are handled by
# [tool.setuptools.packages.find]). Keep in sync with `ls src/*.py`.
py-modules = [
    "_curriculum_shards",
    "_data_loaders",
    "_jsonl",
    "_markdown_split",
    "_paths",
    "_slug",
    "agency_source_coverage",
    "analysis_validation",
    "artifact_evidence",
    "audit_contracts",
    "build_pipeline",
    "citation_workflow",
    "claim_calibration",
    "curriculum",
    "manuscript_injection",
    "manuscript_templates",
    "markdown_cell",
    "markdown_refs",
    "orchestration_audit",
    "orchestration_contracts",
    "output_docs",
    "pdf_quality",
    "prose_policy",
    "publication_readiness",
    "reference_quality",
    "rendered_heading_support",
    "rendered_reference_audit",
    "rendered_reference_emphasis",
    "safety_contract",
    "scholarship_quality",
    "source_identity",
    "source_metadata",
    "source_refresh_due",
    "source_support_strength",
    "template_resolver",
    "unit_education",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Ruff's default rule selection changes between releases. With no explicit
# selection here, and CI invoking the linter through `uvx ruff` (which always
# resolves the newest release), a ruff upgrade can turn this repo's lint job red
# without a single line of the repo changing.
#
# That is not hypothetical: measured 2026-08-12 on an unmodified tree, ruff
# 0.16.2 reported 203 findings (120 I001 import-sorting, plus UP/SIM/RUF/B rules
# that did not exist in the ruleset this code was written against), while the
# selection below reports zero. Pinning keeps a lint failure meaningful — it
# means this repository changed, not that the linter did.
#
# Sibling repo CogSecSkills pins the identical set after hitting the same break.
# Adopting new rule families is a deliberate, separate change: widen `select`,
# fix the findings, and commit both together.
select = ["E", "F"]
ignore = [
    "E501",  # line length — many generated and data-table lines exceed 88 by design
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "requires_mermaid: needs mmdc and Chrome headless shell for real Mermaid PNG renders",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.template]
skip_combined_pytest = true
