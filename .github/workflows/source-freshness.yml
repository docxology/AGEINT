name: Source-refresh freshness

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 14:00 UTC — catches sources whose refresh cadence lapsed
    # without waiting for the next content push.
    - cron: "0 14 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: source-refresh-freshness
  cancel-in-progress: true

jobs:
  freshness:
    name: Check source-refresh due dates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies (dev extra)
        run: uv sync --extra dev

      - name: Compute current source-refresh-due facts
        run: |
          if uv run python scripts/audit_source_refresh_due.py --format json > /tmp/source_refresh_due_latest.json; then
            audit_status=0
          else
            audit_status=$?
          fi
          case "$audit_status" in
            0|1) ;;
            *)
              echo "::error::Source-refresh audit failed operationally (exit $audit_status)."
              exit "$audit_status"
              ;;
          esac
          # Exit 1 is a reportable finding only with one complete, consistent
          # schema-1.0 report. Keep its original JSON for comparison and upload.
          if ! jq -e -s --argjson audit_status "$audit_status" '
            length == 1 and (.[0] |
              type == "object"
              and .project == "AGEINT" and .schema_version == "1.0"
              and (.generated_at | type == "string")
              and (.as_of | type == "string")
              and (.ok | type == "boolean")
              and (.summary | type == "object")
              and (.rows | type == "array")
              and (.issue_rows | type == "array")
              and .summary.row_count == (.rows | length)
              and .issue_row_count == (.issue_rows | length)
              and .ok == ((.rows | length) > 0 and .issue_row_count == 0)
              and .ok == ($audit_status == 0)
            )
          ' /tmp/source_refresh_due_latest.json > /dev/null; then
            echo "::error::Source-refresh audit returned a missing, malformed, unsupported or inconsistent report (exit $audit_status)."
            exit 1
          fi

      - name: Compare with checked-in baseline
        id: diff
        run: |
          if jq -S . output/reports/source_refresh_due.json > /tmp/baseline.json \
            && jq -S . /tmp/source_refresh_due_latest.json > /tmp/latest.json \
            && cmp -s /tmp/baseline.json /tmp/latest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload freshness snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: source-refresh-due-latest
          path: /tmp/source_refresh_due_latest.json
          if-no-files-found: warn

      - name: Open drift issue (skip if one is already open)
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Source-refresh due dates drifted from committed baseline"
        run: |
          existing="$(gh issue list --search "in:title \"$TITLE\"" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Open issue #$existing already tracks this drift; skipping."
            exit 0
          fi
          # Idempotent: `gh label create` errors if the label already exists,
          # so tolerate that one case rather than requiring the label to be
          # pre-provisioned in a fresh repo.
          gh label create "evidence" --color 0e8a16 \
            --description "Source/citation evidence drift or verification" \
            2>/dev/null || true
          gh issue create \
            --title "$TITLE" \
            --label "evidence" \
            --body "The scheduled source-refresh-due audit differs from the committed \`output/reports/source_refresh_due.json\` baseline. Review the uploaded \`source-refresh-due-latest\` artifact, then re-run \`uv run python scripts/audit_source_refresh_due.py --write --format json\` and commit the refreshed baseline once any due sources have been reviewed."
