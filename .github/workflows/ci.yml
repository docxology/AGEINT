name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Locked Ruff check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src tests scripts

  standalone-core:
    name: Limited standalone core (Python ${{ matrix.python }}, not release acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.15.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # No SDK/native toolchain here. Preserve the standalone compatibility
      # signal; only the complete SDK job below enforces the release's 90% bar.
      - run: uv run --no-sync pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=84

  complete-verification:
    name: Complete shared-SDK verification
    uses: ./.github/workflows/manuscript.yml
    with:
      source: ${{ github.sha }}
