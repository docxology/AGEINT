name: Complete manuscript verification

on:
  workflow_call:
    inputs:
      source:
        description: Exact AGEINT commit to verify
        type: string
        required: true
      expected-tag:
        description: Optional stable release tag checked by the metadata CLI
        type: string
        default: ""
    outputs:
      source:
        value: ${{ jobs.complete.outputs.source }}
      sdk-source:
        value: ${{ jobs.complete.outputs.sdk-source }}
      artifact-name:
        value: ${{ jobs.complete.outputs.artifact-name }}
  workflow_dispatch:
    inputs:
      sdk-candidate:
        description: Development verification only; optional immutable 40-hex SDK commit, never release authorization
        type: string
        default: ""
  schedule:
    - cron: "0 15 * * 1"

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  AGEINT_REQUIRE_RENDERED_FIGURES: "1"
  ENABLE_PDF: "1"
  ENABLE_HTML: "1"
  ENABLE_SLIDES: "0"
  ENABLE_DOCX: "0"
  ENABLE_EPUB: "0"

jobs:
  complete:
    name: Fresh Mermaid + SDK PDF/HTML + 90% tests + all audits
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      source: ${{ steps.identity.outputs.source }}
      sdk-source: ${{ steps.identity.outputs.sdk-source }}
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
    steps:
      - name: Select published SDK or explicit development candidate
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.sdk-candidate }}
        run: |
          set -euo pipefail
          if [ -n "$CANDIDATE" ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
            echo "ref=$CANDIDATE" >> "$GITHUB_OUTPUT"
            echo "candidate=true" >> "$GITHUB_OUTPUT"
          else
            gh api repos/docxology/template/releases/tags/v5.1.0 \
              | jq -e '.tag_name == "v5.1.0" and .draft == false and .prerelease == false'
            echo "ref=refs/tags/v5.1.0" >> "$GITHUB_OUTPUT"
            echo "candidate=false" >> "$GITHUB_OUTPUT"
          fi
      # SDK actions deliberately run at workspace root: their npm lock, Python
      # lock, source-owned preparation modules and relative paths belong there.
      - name: Check out exact selected SDK (no floating fallback)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: docxology/template
          ref: ${{ steps.sdk.outputs.ref }}
          submodules: true
          persist-credentials: false
      - name: Check out exact AGEINT Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source || github.sha }}
          path: projects/active/AGEINT
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"
          dependency-group: dev-rendering
      - name: Prepare frozen SDK dev and rendering environment
        run: uv sync --frozen --group dev --group rendering --python 3.14
      - name: Bind exact source and explicit shared runtime
        id: identity
        env:
          REQUESTED_SOURCE: ${{ inputs.source || github.sha }}
          SDK_CANDIDATE: ${{ steps.sdk.outputs.candidate }}
          SDK_REF: ${{ steps.sdk.outputs.ref }}
        run: |
          set -euo pipefail
          source=$(git -C projects/active/AGEINT rev-parse HEAD)
          test "$source" = "$REQUESTED_SOURCE"
          sdk=$(git rev-parse HEAD)
          if [ "$SDK_CANDIDATE" = true ]; then
            test "$sdk" = "$SDK_REF"
          else
            test "$sdk" = "$(git rev-parse 'refs/tags/v5.1.0^{commit}')"
            test "$(uv version --short)" = 5.1.0
          fi
          echo "SDK_VERSION=$(uv version --short)" >> "$GITHUB_ENV"
          epoch=$(git -C projects/active/AGEINT show -s --format=%ct "$source")
          {
            echo "source=$source"
            echo "sdk-source=$sdk"
            echo "artifact-name=verified-ageint-$source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          {
            echo "SOURCE_DATE_EPOCH=$epoch"
            echo "TEMPLATE_BUILD_EPOCH_SOURCE=git:$source"
            echo "AGEINT_TEMPLATE_REPO=$GITHUB_WORKSPACE"
            echo "PYTHONPATH=$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/projects/active/AGEINT/src"
            echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv"
            echo "UV_PROJECT_ENVIRONMENT=$GITHUB_WORKSPACE/.venv"
            echo "UV_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python"
            echo "UV_NO_SYNC=1"
            echo "UV_FROZEN=true"
          } >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/ageint-evidence"
      - uses: ./.github/actions/setup-docs-lint
      - uses: ./.github/actions/setup-acceptance-documents
        with:
          mode: native
          python-executable: .venv/bin/python
      - name: Prepare source-locked offline browser math assets
        run: .venv/bin/python -m infrastructure.reporting.native_dependency_preparation --repo-root .
      - name: Check source release metadata
        working-directory: projects/active/AGEINT
        env:
          EXPECTED_TAG: ${{ inputs.expected-tag }}
        run: |
          set -euo pipefail
          args=(--format json)
          if [ -n "$EXPECTED_TAG" ]; then args+=(--expected-tag "$EXPECTED_TAG"); fi
          python scripts/audit_release_metadata.py "${args[@]}" > "$RUNNER_TEMP/ageint-evidence/release-metadata.json"
          cat "$RUNNER_TEMP/ageint-evidence/release-metadata.json"
      - name: Strict source build with newly rendered Mermaid figures
        working-directory: projects/active/AGEINT
        run: |
          set -euo pipefail
          # Historical image inputs from this exact Source remain available;
          # no prior manuscript, diagram render receipt or native output can pass.
          rm -rf output/manuscript output/data output/reports output/pdf output/web output/slides output/docx output/epub output/figures/mermaid
          rm -f AGEINT.pdf
          python scripts/build_curriculum.py
      - name: Render current native outputs before exercising PDF consumer tests
        run: |
          set -euo pipefail
          .venv/bin/python scripts/pipeline/stage_03_render.py --project active/AGEINT --skip-manuscript-hydration
          .venv/bin/python scripts/pipeline/stage_04_validate.py --project active/AGEINT
          cp projects/active/AGEINT/output/pdf/AGEINT_combined.pdf projects/active/AGEINT/AGEINT.pdf
      - name: Record reader bytes before isolated tests
        working-directory: projects/active/AGEINT
        run: |
          set -euo pipefail
          find AGEINT.pdf output/data output/manuscript output/figures output/pdf output/web output/reports \
            -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum \
            > "$RUNNER_TEMP/ageint-evidence/readers-before-tests.sha256"
      - name: Complete real test suite including strict Mermaid tests (90% minimum)
        working-directory: projects/active/AGEINT
        run: >-
          python -m pytest tests/ --cov=src --cov-report=term-missing
          --cov-report=xml:${{ runner.temp }}/ageint-evidence/coverage.xml
          --cov-fail-under=90 --junitxml=${{ runner.temp }}/ageint-evidence/tests.xml
      - name: Refuse reader mutation by tests and validate source contracts
        working-directory: projects/active/AGEINT
        run: |
          set -euo pipefail
          find AGEINT.pdf output/data output/manuscript output/figures output/pdf output/web output/reports \
            -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum \
            > "$RUNNER_TEMP/ageint-evidence/readers-after-tests.sha256"
          diff -u "$RUNNER_TEMP/ageint-evidence/readers-before-tests.sha256" \
            "$RUNNER_TEMP/ageint-evidence/readers-after-tests.sha256"
          python scripts/validate_declarative_yaml.py
          python scripts/check_rendered_references.py
      - name: SDK markdown and strict prerender validation
        run: |
          set -euo pipefail
          .venv/bin/python -m infrastructure.validation.cli markdown projects/active/AGEINT/output/manuscript --repo-root . --strict
          .venv/bin/python -m infrastructure.validation.cli prerender projects/active/AGEINT/output/manuscript --repo-root .
      - name: SDK PDF and enabled-format output validation with provenance
        run: |
          set -euo pipefail
          .venv/bin/python -m infrastructure.validation.cli pdf projects/active/AGEINT/output/pdf/AGEINT_combined.pdf
          .venv/bin/python scripts/pipeline/stage_04_validate.py --project active/AGEINT
      - name: Prepare inspection-only generated snapshot
        env:
          SOURCE: ${{ steps.identity.outputs.source }}
          SDK_SOURCE: ${{ steps.identity.outputs.sdk-source }}
          SDK_CANDIDATE: ${{ steps.sdk.outputs.candidate }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/ageint-inspection"
          mkdir "$destination"
          jq -n --arg source "$SOURCE" --arg sdk "$SDK_SOURCE" \
            --argjson candidate "$SDK_CANDIDATE" --arg repository "$GITHUB_REPOSITORY" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{inspection_only:true,acceptance:false,repository:$repository,source:$source,sdk_source:$sdk,sdk_candidate:$candidate,run_id:$run,run_attempt:$attempt}' \
            > "$destination/inspection-source.json"
          # This supports native reader review before task prerequisites close.
          # It is never the verified artifact selected by the release workflow.
          (cd projects/active/AGEINT && tar \
            --exclude='output/pdf/_*' --exclude='output/web/_combined_manuscript.md' \
            -czf "$destination/AGEINT-generated.tar.gz" \
            output/data output/manuscript output/figures output/pdf output/web output/reports \
            docs/manuscript/references-*.bib)
          (cd "$destination" && sha256sum AGEINT-generated.tar.gz inspection-source.json > SHA256SUMS)
      - name: Retain inspection-only snapshot, not release acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ageint-inspection-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ageint-inspection/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce all source, figure, PDF and aggregate readiness gates
        working-directory: projects/active/AGEINT
        run: |
          set -euo pipefail
          cp output/pdf/AGEINT_combined.pdf AGEINT.pdf
          for audit in scholarship_quality source_metadata agency_source_coverage claim_calibration reference_quality orchestration_contract source_refresh_due; do
            python "scripts/audit_${audit}.py" --format markdown --write
          done
          python scripts/audit_heading_support.py --format json > "$RUNNER_TEMP/ageint-evidence/heading-support.json"
          python scripts/audit_pdf_quality.py --format json > "$RUNNER_TEMP/ageint-evidence/pdf-quality.json"
          python scripts/audit_artifact_evidence.py --format markdown --write
          # This executes the SDK all-resource guard in its real checkout.
          # A skipped, unavailable or failed guard makes this step fail.
          python scripts/audit_publication_readiness.py --format markdown --write
      - name: Package only verified current-run readers and evidence
        env:
          SOURCE: ${{ steps.identity.outputs.source }}
          SDK_SOURCE: ${{ steps.identity.outputs.sdk-source }}
          EXPECTED_TAG: ${{ inputs.expected-tag }}
          SDK_CANDIDATE: ${{ steps.sdk.outputs.candidate }}
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/projects/active/AGEINT"
          destination="$RUNNER_TEMP/ageint-verified"
          evidence="$RUNNER_TEMP/ageint-evidence"
          mkdir "$destination"
          test -s "$project/output/web/index.html"
          test -s "$project/output/pdf/AGEINT_combined.pdf"
          cp "$project/AGEINT.pdf" "$destination/AGEINT.pdf"
          cp -R "$project/output/reports" "$evidence/reports"
          cp "$project/output/pdf/_combined_manuscript.blg" "$evidence/bibtex.blg"
          cp "$project/output/pdf/_combined_manuscript.log" "$evidence/xelatex.log"
          cp "$RUNNER_TEMP/template-acceptance-document-provenance.json" "$evidence/document-tool-provenance.json"
          jq -n --arg source "$SOURCE" --arg sdk "$SDK_SOURCE" --arg tag "$EXPECTED_TAG" \
            --arg version "$SDK_VERSION" --argjson candidate "$SDK_CANDIDATE" \
            --arg repository "$GITHUB_REPOSITORY" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{repository:$repository,source:$source,sdk_repository:"docxology/template",sdk_tag:(if $candidate then null else "v5.1.0" end),sdk_version:$version,sdk_candidate:$candidate,sdk_source:$sdk,expected_tag:$tag,run_id:$run,run_attempt:$attempt}' \
            > "$destination/source-sdk.json"
          cp "$destination/source-sdk.json" "$evidence/source-sdk.json"
          # Keep sibling directories: web/index.html must resolve ../figures/.
          # The SDK's source-configured local web assets remain inside web/.
          (cd "$project/output" && zip -q -r "$destination/AGEINT-reader.zip" web figures)
          (cd "$evidence" && zip -q -r "$destination/AGEINT-evidence.zip" .)
          # Preserve the post-readiness outputs, never the inspection snapshot.
          (cd "$project" && tar \
            --exclude='output/pdf/_*' --exclude='output/web/_combined_manuscript.md' \
            -czf "$destination/AGEINT-generated.tar.gz" \
            output/data output/manuscript output/figures output/pdf output/web output/reports \
            docs/manuscript/references-*.bib)
          (cd "$destination" && sha256sum AGEINT.pdf AGEINT-reader.zip AGEINT-evidence.zip AGEINT-generated.tar.gz source-sdk.json > SHA256SUMS)
      - name: Upload successful exact-Source deliverables only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: ${{ runner.temp }}/ageint-verified/
          if-no-files-found: error
          retention-days: 14
      - name: Retain actual failure diagnostics without a successful handoff
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ageint-diagnostics-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ageint-evidence/
            projects/active/AGEINT/output/reports/
            projects/active/AGEINT/output/pdf/*.log
            projects/active/AGEINT/output/pdf/*.blg
          if-no-files-found: ignore
          retention-days: 14
