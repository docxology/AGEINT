name: Release AGEINT

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New stable version tag matching source metadata (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

# Serialize all publication attempts, including attempts at different versions.
concurrency:
  group: ageint-publication
  cancel-in-progress: false

jobs:
  preflight:
    name: Select exact main Source and refuse prior publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source: ${{ steps.source.outputs.source }}
    steps:
      - name: Require dispatch at the current main Source and a new stable tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$source" = "$GITHUB_SHA"
          # API errors fail closed; an absent ref/release is not inferred from
          # an authentication, connectivity or server failure.
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            | jq -e --arg ref "refs/tags/$TAG" 'all(.[]; .ref != $ref)'
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -se 'all(.[][]; .tag_name != env.TAG)'
          gh api repos/docxology/template/releases/tags/v5.2.0 \
            | jq -e '.tag_name == "v5.2.0" and .draft == false and .prerelease == false'
          echo "source=$source" >> "$GITHUB_OUTPUT"

  verify:
    name: Complete release acceptance on exact Source
    needs: preflight
    uses: ./.github/workflows/manuscript.yml
    with:
      source: ${{ needs.preflight.outputs.source }}
      expected-tag: ${{ inputs.tag }}

  publish:
    name: Publish only this run's verified readers
    needs: [preflight, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Retrieve exact successful reusable-job artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: verified
      - name: Validate transport checksums and exact source/SDK handoff
        env:
          SOURCE: ${{ needs.preflight.outputs.source }}
          VERIFIED_SOURCE: ${{ needs.verify.outputs.source }}
          SDK_SOURCE: ${{ needs.verify.outputs.sdk-source }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$SOURCE" = "$VERIFIED_SOURCE"
          cd verified
          sha256sum --check --strict SHA256SUMS
          test -s AGEINT.pdf
          test -s AGEINT-reader.zip
          test -s AGEINT-evidence.zip
          test -s AGEINT-generated.tar.gz
          jq -e --arg source "$SOURCE" --arg sdk "$SDK_SOURCE" --arg tag "$TAG" \
            --arg repository "$GITHUB_REPOSITORY" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '.source == $source and .sdk_source == $sdk and .sdk_tag == "v5.2.0" and .sdk_version == "5.2.0" and .sdk_candidate == false and .sdk_repository == "docxology/template" and .expected_tag == $tag and .repository == $repository and .run_id == $run and .run_attempt == $attempt' source-sdk.json
      - name: Recheck publication absence and main, then create immutable tag/release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.preflight.outputs.source }}
          SDK_SOURCE: ${{ needs.verify.outputs.sdk-source }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            | jq -e --arg ref "refs/tags/$TAG" 'all(.[]; .ref != $ref)'
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -se 'all(.[][]; .tag_name != env.TAG)'
          gh api repos/docxology/template/releases/tags/v5.2.0 \
            | jq -e '.tag_name == "v5.2.0" and .draft == false and .prerelease == false'
          test "$(gh api repos/docxology/template/commits/v5.2.0 --jq .sha)" = "$SDK_SOURCE"
          cat > "$RUNNER_TEMP/ageint-release-notes.txt" <<EOF
          AGEINT $TAG

          Changes: https://github.com/$GITHUB_REPOSITORY/blob/$SOURCE/CHANGELOG.md

          Source: $SOURCE
          SDK: docxology/template v5.2.0 (exact commit in source-sdk.json).
          Complete verification: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          AGEINT.pdf is the verified SDK-rendered PDF. Extract AGEINT-reader.zip
          and serve its root over local HTTP; visit /web/index.html, retaining
          sibling figures/ and local assets. Scholarly links are user-clicked
          references, not remotely fetched runtime assets.
          AGEINT-evidence.zip contains the actual audit, test, coverage and tool
          provenance evidence. SHA256SUMS binds all reader/evidence assets.
          AGEINT-generated.tar.gz retains the generated manuscript, bibliography
          and non-temporary outputs after aggregate readiness passed.
          EOF
          # Last remote observation before the atomic create-only ref request.
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$SOURCE"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$SOURCE" \
            | jq -e --arg source "$SOURCE" '.object.sha == $source'
          # No force, tag movement, upload --clobber or release replacement.
          # A failed publication leaves any created tag intact for inspection;
          # reruns refuse it rather than overwriting or silently authorizing reuse.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$SOURCE" \
            --title "AGEINT $TAG" --notes-file "$RUNNER_TEMP/ageint-release-notes.txt" \
            verified/AGEINT.pdf verified/AGEINT-reader.zip verified/AGEINT-evidence.zip \
            verified/AGEINT-generated.tar.gz \
            verified/source-sdk.json verified/SHA256SUMS
